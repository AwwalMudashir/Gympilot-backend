services:
  - type: web
    name: gymbro-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: gymbro-api
      - key: APP_TIME_ZONE
        value: Africa/Lagos
      - key: FRONTEND_BASE_URL
        value: gymbro://auth
      - key: PUBLIC_API_BASE_URL
        value: https://gympilot-backend-zjzy.onrender.com
      - key: EXPOSE_DEVELOPMENT_TOKENS
        value: "false"
      - key: EMAIL_DELIVERY_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: GymBro
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gymbro
      - key: PLAN_EXPLANATION_AI_ENABLED
        value: "false"
      - key: SPRING_AI_CHAT_MODEL
        value: none
      - key: COACH_AI_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_TEMPERATURE
        value: "0.2"
      - key: SPRING_AI_RETRY_MAX_ATTEMPTS
        value: "1"
