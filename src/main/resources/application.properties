spring.application.name=gympilot-backend

# Load local variables from .env when it is present. Operating-system and
# deployment environment variables continue to take precedence.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL / Flyway
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gympilot}
spring.datasource.username=${DB_USERNAME:gympilot}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Consistent JSON and safe framework errors
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-binding-errors=never

# Health endpoint only; expose more deliberately when needed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Authentication secrets must be provided by .env or the deployment environment.
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-issuer=${JWT_ISSUER:gympilot-api}
app.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.security.password-reset-minutes=${PASSWORD_RESET_MINUTES:30}
app.security.email-verification-hours=${EMAIL_VERIFICATION_HOURS:24}
app.security.max-failed-logins=${MAX_FAILED_LOGINS:5}
app.security.lock-minutes=${ACCOUNT_LOCK_MINUTES:15}
app.security.expose-development-tokens=${EXPOSE_DEVELOPMENT_TOKENS:false}
app.security.frontend-base-url=${FRONTEND_BASE_URL:gympilot://auth}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://10.0.2.2:8081}

# Cloudinary image storage. Credentials must only be supplied as environment variables.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:gympilot}
app.cloudinary.max-image-bytes=${CLOUDINARY_MAX_IMAGE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Optional SMTP configuration. Keep credentials in .env/deployment secrets.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
